<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>茅 vs 春</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:#101a0b;color:#fff;padding:12px;
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap{width:900px;max-width:100%;}
  #hud{
    display:flex;align-items:center;gap:6px;background:#2b4420;
    padding:8px 10px;border-radius:12px 12px 0 0;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);
  }
  .avatar{
    width:48px;height:48px;border-radius:50%;object-fit:cover;
    border:2px solid #ffd75e;background:#16240f;flex:0 0 auto;
  }
  .avatar.enemy{border-color:#ff6b6b;}
  #sunBox{
    display:flex;align-items:center;gap:5px;background:#f5e9c8;color:#3a2c10;
    border-radius:8px;padding:4px 10px;font-weight:800;min-width:86px;
    font-variant-numeric:tabular-nums;flex:0 0 auto;
  }
  #sunBox img{width:26px;height:26px;object-fit:contain;}
  #cards{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px;
         scroll-behavior:smooth;}
  .card{
    position:relative;width:56px;height:72px;background:#d9c18a;
    border:2px solid #8a6f3c;border-radius:8px;
    cursor:grab;overflow:hidden;flex:0 0 auto;transition:transform .08s;
    touch-action:none;
  }
  .card:active{transform:scale(.96);cursor:grabbing;}
  .card img{
    width:100%;height:50px;object-fit:contain;display:block;margin-top:2px;
    pointer-events:none;-webkit-user-drag:none;
  }
  .card .cost{
    position:absolute;bottom:0;left:0;right:0;text-align:center;
    font-size:12px;font-weight:800;color:#2b1c00;background:#e8d5a5;
    line-height:18px;pointer-events:none;
  }
  .card .cd{
    position:absolute;left:0;right:0;top:0;height:0%;
    background:rgba(0,0,0,.6);pointer-events:none;transition:height .1s linear;
  }
  .card.disabled{filter:grayscale(.75) brightness(.72);cursor:not-allowed;}
  .card.selected{outline:3px solid #ffe066;box-shadow:0 0 14px #ffe066;}
  .card.dragging{opacity:.4;outline:2px dashed #ffe066;}

  /* ★ 卡片栏左右箭头 */
  .arrowBtn{
    width:32px;height:46px;flex:0 0 auto;
    background:#3d5c2c;border:2px solid #6b8a52;
    border-radius:8px;cursor:pointer;padding:0;
    color:#e6ffd0;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s,transform .08s;
    -webkit-tap-highlight-color:transparent;
  }
  .arrowBtn:active{background:#5a7d40;transform:scale(.94);}
  .arrowBtn:disabled{opacity:.35;cursor:not-allowed;}

  #shovelBtn{
    width:46px;height:46px;flex:0 0 auto;background:#3d5c2c;border:2px solid #6b8a52;
    border-radius:8px;cursor:pointer;padding:2px;
  }
  #shovelBtn.active{outline:3px solid #ffe066;box-shadow:0 0 12px #ffe066;}
  #shovelBtn img{width:100%;height:100%;object-fit:contain;}

  /* ★ 暂停键 */
  #pauseBtn{
    width:46px;height:46px;flex:0 0 auto;
    background:#3d5c2c;border:2px solid #6b8a52;border-radius:8px;
    cursor:pointer;padding:0;color:#e6ffd0;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s;
    -webkit-tap-highlight-color:transparent;
  }
  #pauseBtn:active{background:#5a7d40;}
  #pauseBtn.active{outline:3px solid #ffe066;box-shadow:0 0 12px #ffe066;background:#7a5a20;}

  #timerBox{
    background:#16240f;padding:6px 10px;border-radius:8px;font-weight:800;
    color:#b6f08a;white-space:nowrap;font-variant-numeric:tabular-nums;
    flex:0 0 auto;font-size:14px;
  }
  #stage{position:relative;line-height:0;}
  canvas{
    display:block;width:100%;border-radius:0 0 12px 12px;background:#3a5f2a;
    cursor:pointer;touch-action:none;
  }
  #overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.75);border-radius:0 0 12px 12px;line-height:1.6;
    text-align:center;padding:20px;backdrop-filter:blur(3px);
  }
  #overlay.show{display:flex;}
  .ov-inner{max-width:580px;}
  #overlay h1{margin:0 0 10px;font-size:30px;letter-spacing:2px;color:#c9f58e;}
  #overlay p{margin:0 0 14px;color:#d8e6cd;font-size:15px;white-space:pre-line;}
  #ovStats{font-size:15px;color:#ffe066;font-weight:700;margin-bottom:16px;white-space:pre-line;}
  #ovBtn{
    padding:11px 34px;font-size:17px;font-weight:800;cursor:pointer;
    background:#7bc043;color:#12240a;border:none;border-radius:10px;
    box-shadow:0 4px 0 #4e7f28;transition:.08s;
  }
  #ovBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #4e7f28;}
  @media(max-width:640px){
    .card{width:44px;height:62px;}
    .card img{height:42px;}
    .avatar{width:38px;height:38px;}
    .arrowBtn{width:26px;height:40px;}
    #shovelBtn,#pauseBtn{width:40px;height:40px;}
    #timerBox{font-size:12px;padding:5px 7px;}
    #sunBox{min-width:64px;font-size:13px;padding:4px 6px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <img class="avatar" src="mao.png" alt="茅">
    <div id="sunBox"><img src="sun.png" alt=""><span id="sunCount">100</span></div>

    <!-- ★ 卡片栏左箭头 -->
    <button class="arrowBtn" id="arrowLeft" title="向左滚动">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="3"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div id="cards"></div>

    <!-- ★ 卡片栏右箭头 -->
    <button class="arrowBtn" id="arrowRight" title="向右滚动">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="3"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button id="shovelBtn" title="铲除植物"><img src="shovel.png" alt="铲"></button>

    <!-- ★ 暂停键 -->
    <button id="pauseBtn" title="暂停 / 继续"></button>

    <div id="timerBox">存活 <span id="timer">0.0</span>s</div>
    <img class="avatar enemy" src="chun.png" alt="春">
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div class="ov-inner">
        <h1 id="ovTitle">茅 vs 春</h1>
        <p id="ovText"></p>
        <div id="ovStats"></div>
        <button id="ovBtn">开始防守</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   1. 资源清单
   ========================================================= */
const ASSETS = {
  background:        'background.png',
  sun:               'sun.png',
  shovel:            'shovel.png',
  pea:               'pea_maodou.png',
  ice:               'pea_ice.png',
  cup:               'water_cup.png',
  mao:               'mao.png',
  chun:              'chun.png',
  plant_maodou:      'plant_maodou_shooter.png',
  plant_xiangri:     'plant_xiangrimao.png',
  plant_shuibei:     'plant_shuibei_tosser.png',
  plant_maotouying:  'plant_maotouying.png',
  plant_hanbing:     'plant_hanbing_shooter.png',
  plant_maotong:     'plant_maotong_wall.png',
  plant_zunmine:     'plant_zun_mine.png',
  plant_tankmao:     'plant_tank_mao.png',
  plant_maodan:      'plant_maodan.png',
  zombie_normal:     'zombie_chun_normal.png',
  zombie_cone:       'zombie_chun_cone.png',
  zombie_bucket:     'zombie_chun_bucket.png',
  zombie_fast:       'zombie_chun_fast.png',
  zombie_tank:       'zombie_chun_tank.png'
};

const IMG = {};
function loadImage(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload  = ()=>res(im);
    im.onerror = ()=>{ im.broken = true; res(im); };
    im.src = src;
  });
}
function ok(im){ return im && !im.broken && im.naturalWidth > 0; }

/* =========================================================
   2. 常量
   ========================================================= */
const CV = document.getElementById('cv');
const ctx = CV.getContext('2d');
const ROWS = 5;
const CELL_W = 88, CELL_H = 104;
const LAWN_X = 90, LAWN_Y = 40;
const LAWN_W = 9 * CELL_W;
const LAWN_H = ROWS * CELL_H;
CV.width = 900; CV.height = 560;

const PLANT_ZONE_RIGHT = Math.round(CV.width / 4);
const PLANT_MIN_X = 38;
const PLANT_MAX_X = CV.width - 38;
const PLANT_MIN_Y = LAWN_Y + 10;
const PLANT_MAX_Y = LAWN_Y + LAWN_H - 6;

const ZOMBIE_GOAL_X = 8;

const DENSITY_RAMP_TIME = 300;
const DENSITY_RAMP_MULT = 4.0;

const BEST_KEY = 'mao_vs_chun_best_time';

/* =========================================================
   3. 植物数据
   ========================================================= */
const PLANTS = {
  maodou:    { key:'maodou',    name:'毛豆射手',   img:'plant_maodou',    cost:100, cooldown:7.5, hp:300,  kind:'shooter', interval:1.4, damage:20, projSpeed:520, proj:'pea',  fallback:'#63c24a' },
  xiangri:   { key:'xiangri',   name:'向日茅',     img:'plant_xiangri',   cost:50,  cooldown:7.5, hp:300,  kind:'sun',     interval:9,   sunValue:25, fallback:'#f2c94c' },
  shuibei:   { key:'shuibei',   name:'水杯投手',   img:'plant_shuibei',   cost:150, cooldown:8,   hp:300,  kind:'lobber',  interval:3.2, damage:45, splash:64, fallback:'#4aa3df' },
  maotouying:{ key:'maotouying',name:'大嘴猫头鹰', img:'plant_maotouying',cost:150, cooldown:12,  hp:300,  kind:'shooter', interval:2.6, damage:60, projSpeed:600, proj:'word', fallback:'#b06bd6' },
  hanbing:   { key:'hanbing',   name:'寒冰射手',   img:'plant_hanbing',   cost:150, cooldown:8,   hp:300,  kind:'shooter', interval:1.4, damage:20, projSpeed:520, proj:'ice', slow:true, fallback:'#6fd3ea' },
  maotong:   { key:'maotong',   name:'茂桐墙',     img:'plant_maotong',   cost:50,  cooldown:15,  hp:1500, kind:'wall',    fallback:'#8b6f47' },
  zunmine:   { key:'zunmine',   name:'尊地雷',     img:'plant_zunmine',   cost:150, cooldown:12,  hp:300,  kind:'mine',    killRadius:48, blastRadius:150, maxDamage:900, fallback:'#c94a4a' },
  tankmao:   { key:'tankmao',   name:'坦克茅',     img:'plant_tankmao',   cost:200, cooldown:25,  hp:2000, kind:'tank',    speed:90, hitRadiusX:58, hitRadiusY:72, fallback:'#8a9a6a' },
  maodan:    { key:'maodan',    name:'茅弹',       img:'plant_maodan',    cost:550, cooldown:180, hp:1,    kind:'bomb',    fallback:'#ff6b6b' }
};
const CARD_ORDER = ['maodou','xiangri','shuibei','maotouying','hanbing','maotong','zunmine','tankmao','maodan'];

/* =========================================================
   4. 僵尸数据
   ========================================================= */
const ZOMBIES = {
  normal: { key:'normal', name:'春',     img:'zombie_normal', hp:200,  speed:15, dps:30, w:66, h:96,  fallback:'#7a9f5a' },
  cone:   { key:'cone',   name:'路障春', img:'zombie_cone',   hp:420,  speed:15, dps:30, w:66, h:96,  fallback:'#6e944f' },
  bucket: { key:'bucket', name:'铁桶春', img:'zombie_bucket', hp:820,  speed:14, dps:34, w:68, h:98,  fallback:'#5f7f45' },
  fast:   { key:'fast',   name:'疾风春', img:'zombie_fast',   hp:180,  speed:35, dps:26, w:60, h:92,  fallback:'#a8c96b' },
  tank:   { key:'tank',   name:'坦克春', img:'zombie_tank',   hp:200,  speed:15, dps:30, w:86, h:106, fallback:'#4f6040' }
};

const WORD_POOL = ['操','傻逼','脑瘫','乐子','二货','去死','你妈','傻屌'];

/* =========================================================
   5. 状态
   ========================================================= */
let state = {
  sun:100, time:0, running:false, over:false, paused:false,
  plants:[], zombies:[], projectiles:[], suns:[], explosions:[],
  bombs:[],
  cooldowns:{}, selected:null,
  spawnTimer:20, skySunTimer:5, nextWave:30, waveCount:0,
  pending:[], best:0
};
let shovelMode = false;
let mouseX = -999, mouseY = -999;
let dragPlant = null;
let dragOffX = 0, dragOffY = 0;
let dragOrigX = 0, dragOrigY = 0;
let cardDrag = null;

/* =========================================================
   6. 工具
   ========================================================= */
function rand(a,b){ return a + Math.random()*(b-a); }

function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawAsset(img,x,y,w,h,fallback){
  if (ok(img)){
    ctx.drawImage(img,x,y,w,h);
  }else{
    ctx.fillStyle = fallback || '#7a7a7a';
    rr(x,y,w,h,Math.min(w,h)*0.2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.font = 'bold ' + Math.round(Math.min(w,h)*0.32) + 'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', x+w/2, y+h/2);
  }
}

function loadBest(){
  const v = parseFloat(localStorage.getItem(BEST_KEY));
  return isNaN(v) ? 0 : v;
}
function saveBest(v){ try{ localStorage.setItem(BEST_KEY, v.toFixed(2)); }catch(e){} }

function clientToCanvas(cx, cy){
  const r = CV.getBoundingClientRect();
  return { x:(cx-r.left)*(CV.width/r.width), y:(cy-r.top)*(CV.height/r.height) };
}
function isInsideCanvas(cx, cy){
  const r = CV.getBoundingClientRect();
  return cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom;
}

function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1, 3) + c1 * Math.pow(t-1, 2);
}

/* =========================================================
   7. 位置合法性
   ========================================================= */
function isValidPos(x, y, plant){
  if (y < PLANT_MIN_Y || y > PLANT_MAX_Y) return false;
  if (x < PLANT_MIN_X) return false;
  const key = plant && plant.type;
  const isGlobal = (key === 'zunmine' || key === 'maodan');
  if (isGlobal){
    if (x > PLANT_MAX_X) return false;
    if (key === 'maodan') return true;
  }else{
    if (x > PLANT_ZONE_RIGHT) return false;
  }
  if (plant && PLANTS[key] && PLANTS[key].kind === 'tank') return true;
  for (const p of state.plants){
    if (p === plant) continue;
    if (PLANTS[p.type].kind === 'tank') continue;
    const dx = (p.x - x) / 46;
    const dy = (p.y - y) / 54;
    if (dx*dx + dy*dy < 1) return false;
  }
  return true;
}

function findPlantIndexAt(x, y){
  for (let i=state.plants.length-1; i>=0; i--){
    const p = state.plants[i];
    if (Math.abs(p.x - x) < 42 && Math.abs(p.y + 6 - y) < 52) return i;
  }
  return -1;
}

/* =========================================================
   8. 开局 / 结束
   ========================================================= */
function startGame(){
  state = {
    sun:100, time:0, running:true, over:false, paused:false,
    plants:[], zombies:[], projectiles:[], suns:[], explosions:[],
    bombs:[],
    cooldowns:{ maodou:0, xiangri:0, shuibei:0, maotouying:0, hanbing:0, maotong:0, zunmine:0, tankmao:0, maodan:0 },
    selected:null,
    spawnTimer:6, skySunTimer:5, nextWave:30, waveCount:0,
    pending:[], best:0
  };
  shovelMode = false;
  dragPlant = null;
  cardDrag = null;
  document.getElementById('shovelBtn').classList.remove('active');
  document.getElementById('overlay').classList.remove('show');
  updatePauseButton();
  updateHUD();
}

function gameOver(){
  if (state.over) return;
  state.over = true;
  state.running = false;
  state.paused = false;
  const best = Math.max(loadBest(), state.time);
  saveBest(best);
  state.best = best;
  updatePauseButton();
  showOverlay(
    '茅的后庭被攻破了……',
    '「春」走到了最左侧。再来一次，撑得更久一点！',
    '本次存活：' + state.time.toFixed(1) + ' 秒\n历史最长存活：' + best.toFixed(1) + ' 秒',
    '重新开始',
    startGame
  );
}

const overlayEl = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText  = document.getElementById('ovText');
const ovStats = document.getElementById('ovStats');
const ovBtn   = document.getElementById('ovBtn');

function showOverlay(title, text, stats, btnText, action){
  ovTitle.textContent = title;
  ovText.textContent  = text;
  ovStats.textContent = stats || '';
  ovBtn.textContent   = btnText;
  ovBtn.onclick       = action;
  overlayEl.classList.add('show');
}

/* =========================================================
   9. 卡片 UI
   ========================================================= */
const cardEls = {};
function buildCards(){
  const box = document.getElementById('cards');
  box.innerHTML = '';
  CARD_ORDER.forEach(key=>{
    const def = PLANTS[key];
    const el = document.createElement('div');
    el.className = 'card';
    el.title = def.name + '（' + def.cost + '阳光）';
    el.innerHTML =
      '<img src="' + ASSETS[def.img] + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="cost">' + def.cost + '</div>' +
      '<div class="cd"></div>';

    el.addEventListener('pointerdown', ev=>{
      if (!state.running || state.over || state.paused) return;   /* ★ 暂停时不响应 */
      const d = PLANTS[key];
      if (state.cooldowns[key] > 0 || state.sun < d.cost) return;
      ev.preventDefault();
      if (key === 'maodan'){
        state.selected = (state.selected === key) ? null : key;
        shovelMode = false;
        document.getElementById('shovelBtn').classList.remove('active');
        updateHUD();
        return;
      }
      const p0 = clientToCanvas(ev.clientX, ev.clientY);
      cardDrag = {
        key, pointerId: ev.pointerId,
        startClientX: ev.clientX, startClientY: ev.clientY,
        x: p0.x, y: p0.y, moved: false
      };
      el.classList.add('dragging');
      try{ el.setPointerCapture(ev.pointerId); }catch(_){}
    });

    el.addEventListener('pointermove', ev=>{
      if (!cardDrag || cardDrag.pointerId !== ev.pointerId) return;
      const dx = ev.clientX - cardDrag.startClientX;
      const dy = ev.clientY - cardDrag.startClientY;
      if (!cardDrag.moved && Math.hypot(dx, dy) > 6){
        cardDrag.moved = true;
        if (state.selected === cardDrag.key) state.selected = null;
        updateHUD();
      }
      const p = clientToCanvas(ev.clientX, ev.clientY);
      cardDrag.x = p.x; cardDrag.y = p.y;
      mouseX = p.x; mouseY = p.y;
    });

    function finishCardDrag(ev, cancelled){
      if (!cardDrag || cardDrag.pointerId !== ev.pointerId) return;
      const cd = cardDrag;
      cardDrag = null;
      const cel = cardEls[cd.key];
      if (cel) cel.classList.remove('dragging');
      if (cancelled) return;
      if (!state.running || state.over || state.paused) return;
      if (cd.moved){
        if (!isInsideCanvas(ev.clientX, ev.clientY)) return;
        const p = clientToCanvas(ev.clientX, ev.clientY);
        state.selected = null;
        tryPlacePlant(p.x, p.y, cd.key);
      }else{
        state.selected = (state.selected === cd.key) ? null : cd.key;
        shovelMode = false;
        document.getElementById('shovelBtn').classList.remove('active');
        updateHUD();
      }
    }
    el.addEventListener('pointerup', ev=>finishCardDrag(ev, false));
    el.addEventListener('pointercancel', ev=>finishCardDrag(ev, true));

    box.appendChild(el);
    cardEls[key] = el;
  });
}

const sunCountEl = document.getElementById('sunCount');
const timerEl    = document.getElementById('timer');

function updateHUD(){
  sunCountEl.textContent = state.sun;
  timerEl.textContent = state.time.toFixed(1);
  CARD_ORDER.forEach(key=>{
    const el = cardEls[key];
    if (!el) return;
    const def = PLANTS[key];
    const cdLeft = state.cooldowns[key] || 0;
    const canAfford = state.sun >= def.cost;
    const blocked = cdLeft > 0 || !canAfford;
    el.classList.toggle('disabled', blocked && state.selected !== key);
    el.classList.toggle('selected', state.selected === key);
    el.querySelector('.cd').style.height = Math.min(100, cdLeft / def.cooldown * 100) + '%';
  });
}

/* =========================================================
   10. 生成逻辑
   ========================================================= */
function spawnZombie(){
  const t = state.time;
  const pool = [['normal',10]];
  if (t > 20) pool.push(['cone',7]);
  if (t > 45) pool.push(['bucket',5]);
  if (t > 70) pool.push(['fast',6]);
  if (t > 30) pool.push(['tank',3]);

  let total = 0;
  pool.forEach(p=>total += p[1]);
  let r = Math.random()*total, type = 'normal';
  for (let i=0;i<pool.length;i++){
    r -= pool[i][1];
    if (r <= 0){ type = pool[i][0]; break; }
  }

  const row = Math.floor(Math.random()*ROWS);
  const def = ZOMBIES[type];
  const baseY = LAWN_Y + row*CELL_H + CELL_H/2 + 8;
  const jumpMid = t > 100 && Math.random() < 0.10;
  const startX = CV.width + 40;
  const endX   = CV.width * rand(0.46, 0.56);

  state.zombies.push({
    type, row,
    x: startX, y: baseY,
    hp: def.hp, maxHp: def.hp,
    slowTimer:0, hitFlash:0, walkT: Math.random()*10, eating:false,
    jumping: jumpMid,
    jumpT: 0, jumpDur: 0.95,
    jumpStartX: startX, jumpStartY: baseY,
    jumpEndX: endX, jumpEndY: baseY,
    drawYOffset: 0, jumpFlash: 0,
    blocked: false,
    dialogAge: 0
  });
}

function spawnSkySun(){
  const tx = rand(PLANT_MIN_X, PLANT_MAX_X);
  const ty = rand(PLANT_MIN_Y, PLANT_MAX_Y);
  state.suns.push({ x: tx, y: LAWN_Y - 60, targetY: ty, vy: 0, value: 25, life: 13, born: 0 });
}

function spawnPlantSun(p){
  state.suns.push({
    x: p.x + rand(-18,18), y: p.y - 20, targetY: p.y + rand(6,30),
    vy: 0, value: PLANTS[p.type].sunValue, life: 13, born: 0
  });
}

function spawnLogic(dt){
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0){
    const t = state.time;
    let interval = Math.max(5.5, 12 - t*0.064) * rand(0.85, 1.15);
    if (t > DENSITY_RAMP_TIME) interval /= DENSITY_RAMP_MULT;
    state.spawnTimer = interval;
    spawnZombie();
  }

  if (state.time >= state.nextWave){
    state.nextWave += 40;
    state.waveCount++;
    let n = Math.max(2, Math.round((4 + state.waveCount) * 0.67));
    if (state.time > DENSITY_RAMP_TIME) n = Math.round(n * DENSITY_RAMP_MULT);
    for (let i=0;i<n;i++) state.pending.push({ t: i*0.35 });
  }
  for (let i=state.pending.length-1;i>=0;i--){
    state.pending[i].t -= dt;
    if (state.pending[i].t <= 0){
      spawnZombie();
      state.pending.splice(i,1);
    }
  }

  state.skySunTimer -= dt;
  if (state.skySunTimer <= 0){
    state.skySunTimer = rand(8,12);
    spawnSkySun();
  }
}

/* =========================================================
   11. 更新
   ========================================================= */
function nearestZombie(y, x){
  let best = null, bestScore = Infinity;
  for (const z of state.zombies){
    if (z.hp <= 0) continue;
    if (z.x < x - 10) continue;
    const dy = Math.abs(z.y - y);
    if (dy > 84) continue;
    const score = z.x + dy * 2;
    if (score < bestScore){ bestScore = score; best = z; }
  }
  return best;
}
function hasZombieNear(y, x){ return nearestZombie(y, x) !== null; }

function explodeMine(p, def){
  state.explosions.push({ x:p.x, y:p.y, t:0, maxT:0.55, radius:def.blastRadius });
  for (const z of state.zombies){
    if (z.hp <= 0) continue;
    const d = Math.hypot(z.x - p.x, z.y - p.y);
    if (d < def.killRadius){
      damageZombie(z, 99999, false);
    }else if (d < def.blastRadius){
      const k = 1 - (d - def.killRadius) / (def.blastRadius - def.killRadius);
      damageZombie(z, Math.round(def.maxDamage * k), false);
    }
  }
}

function updatePlants(dt){
  for (const p of state.plants){
    if (p.hp <= 0) continue;
    const def = PLANTS[p.type];
    p.t += dt;

    if (def.kind === 'shooter'){
      p.cd -= dt;
      if (p.cd <= 0 && hasZombieNear(p.y, p.x)){
        p.cd = def.interval;
        state.projectiles.push({
          x: p.x + 26, y: p.y - 22,
          vx: def.projSpeed, vy: 0,
          damage: def.damage,
          kind: def.proj, slow: !!def.slow,
          life: 6, dead: false,
          text: def.proj === 'word' ? WORD_POOL[(Math.random()*WORD_POOL.length)|0] : ''
        });
      }
    }
    else if (def.kind === 'sun'){
      p.cd -= dt;
      if (p.cd <= 0){ p.cd = def.interval; spawnPlantSun(p); }
    }
    else if (def.kind === 'lobber'){
      p.cd -= dt;
      if (p.cd <= 0){
        const target = nearestZombie(p.y, p.x);
        if (target){
          p.cd = def.interval;
          const sx = p.x + 8, sy = p.y - 40;
          const T = 0.9, g = 900;
          const vx = (target.x - sx) / T;
          const vy = (target.y - 30 - sy - 0.5*g*T*T) / T;
          state.projectiles.push({
            x: sx, y: sy, vx, vy, g,
            damage: def.damage, splash: def.splash,
            kind: 'cup', slow:false, life: 5, dead:false, text:'', rot: 0
          });
        }
      }
    }
    else if (def.kind === 'mine'){
      for (const z of state.zombies){
        if (z.hp <= 0 || z.jumping) continue;
        if (Math.abs(z.x - p.x) < 42 && Math.abs(z.y - p.y) < 56){
          explodeMine(p, def);
          p.hp = 0;
          break;
        }
      }
    }
    else if (def.kind === 'tank'){
      let blockedByTank = null;
      for (const z of state.zombies){
        if (z.hp <= 0) continue;
        if (z.type !== 'tank') continue;
        if (Math.abs(z.x - p.x) < def.hitRadiusX + 26 &&
            Math.abs(z.y - p.y) < def.hitRadiusY){
          blockedByTank = z; break;
        }
      }
      if (!blockedByTank){
        p.x += def.speed * dt;
        for (const z of state.zombies){
          if (z.hp <= 0) continue;
          if (z.type === 'tank') continue;
          if (Math.abs(z.x - p.x) < def.hitRadiusX &&
              Math.abs(z.y - p.y) < def.hitRadiusY){
            damageZombie(z, 99999, false);
          }
        }
      }
      if (p.x > CV.width + 120) p.hp = 0;
    }
  }
  state.plants = state.plants.filter(p => p.hp > 0);
}

function damageZombie(z, dmg, slow){
  z.hp -= dmg;
  z.hitFlash = 0.12;
  if (slow) z.slowTimer = Math.max(z.slowTimer, 3);
  if (z.hp <= 0) z.dead = true;
}

function updateZombies(dt){
  for (const z of state.zombies){
    if (z.hp <= 0) continue;
    const def = ZOMBIES[z.type];
    if (z.slowTimer > 0) z.slowTimer -= dt;

    if (z.jumping){
      z.jumpT += dt;
      const p = Math.min(1, z.jumpT / z.jumpDur);
      z.x = z.jumpStartX + (z.jumpEndX - z.jumpStartX) * p;
      z.y = z.jumpStartY + (z.jumpEndY - z.jumpStartY) * p;
      z.drawYOffset = -Math.sin(p * Math.PI) * 170;
      z.walkT += dt * 10;
      if (z.hitFlash > 0) z.hitFlash -= dt;
      if (p >= 1){
        z.jumping = false;
        z.drawYOffset = 0;
        z.jumpFlash = 0.5;
      }
      continue;
    }

    if (z.type === 'tank'){
      let blockedByTank = null;
      for (const p of state.plants){
        if (p.hp <= 0) continue;
        if (PLANTS[p.type].kind !== 'tank') continue;
        if (Math.abs(p.x - z.x) < 90 && Math.abs(p.y - z.y) < 72){
          blockedByTank = p; break;
        }
      }
      if (blockedByTank){
        if (!z.blocked){
          z.blocked = true;
          z.dialogAge = 0;
        }
        z.dialogAge += dt;
        z.walkT += dt * 2;
        if (z.hitFlash > 0) z.hitFlash -= dt;
        if (z.jumpFlash > 0) z.jumpFlash -= dt;
        continue;
      }
      z.blocked = false;
    }

    const speedMul = z.slowTimer > 0 ? 0.5 : 1;
    let target = null;
    for (const p of state.plants){
      if (p.hp <= 0) continue;
      if (PLANTS[p.type].kind === 'tank') continue;
      const d = z.x - p.x;
      if (d > -14 && d < 42 && Math.abs(z.y - p.y) < 58){
        if (!target || p.x > target.x) target = p;
      }
    }
    if (target){
      z.eating = true;
      target.hp -= def.dps * dt;
    }else{
      z.eating = false;
      z.x -= def.speed * speedMul * dt;
    }

    if (z.hitFlash > 0) z.hitFlash -= dt;
    if (z.jumpFlash > 0) z.jumpFlash -= dt;
    z.walkT += dt * (z.eating ? 2.5 : 6) * speedMul;

    if (z.x < ZOMBIE_GOAL_X){ gameOver(); return; }
  }
  state.zombies = state.zombies.filter(z => z.hp > 0 && !z.dead);
}

function updateProjectiles(dt){
  for (const pr of state.projectiles){
    pr.x += pr.vx * dt;
    if (pr.g !== undefined){
      pr.vy += pr.g * dt;
      pr.y += pr.vy * dt;
      pr.rot += dt * 9;
    }
    pr.life -= dt;
    if (pr.life <= 0){ pr.dead = true; continue; }
    for (const z of state.zombies){
      if (z.hp <= 0) continue;
      const dx = Math.abs(z.x - pr.x);
      const dy = Math.abs(z.y - pr.y);
      if (dx < 34 && dy < 60){
        damageZombie(z, pr.damage, pr.slow);
        if (pr.splash){
          for (const z2 of state.zombies){
            if (z2 === z || z2.hp <= 0) continue;
            if (Math.abs(z2.x - z.x) < pr.splash && Math.abs(z2.y - z.y) < 90){
              damageZombie(z2, Math.round(pr.damage*0.5), pr.slow);
            }
          }
        }
        pr.dead = true;
        break;
      }
    }
    if (pr.x > CV.width + 100 || pr.y > CV.height + 100) pr.dead = true;
  }
  state.projectiles = state.projectiles.filter(p => !p.dead);
}

function updateSuns(dt){
  for (const s of state.suns){
    if (s.y < s.targetY){
      s.vy += 220 * dt;
      s.y += s.vy * dt;
      if (s.y >= s.targetY){ s.y = s.targetY; s.vy = 0; }
    }else{
      s.born += dt;
      if (s.born > s.life) s.dead = true;
    }
  }
  state.suns = state.suns.filter(s => !s.dead);
}

function updateBombs(dt){
  for (const b of state.bombs){
    if (b.exploded) continue;
    b.vy += 2200 * dt;
    b.curY += b.vy * dt;
    if (b.curY >= b.y){
      b.curY = b.y;
      b.exploded = true;
      for (const z of state.zombies) if (z.hp > 0) damageZombie(z, 99999, false);
      state.explosions.push({ x: b.x, y: b.y, t:0, maxT:1.2, radius: 900, big: true });
    }
  }
  state.bombs = state.bombs.filter(b => !b.exploded);
}

function updateExplosions(dt){
  for (const e of state.explosions){
    e.t += dt;
    if (e.t >= e.maxT) e.dead = true;
  }
  state.explosions = state.explosions.filter(e => !e.dead);
}

function update(dt){
  state.time += dt;
  for (const k in state.cooldowns){
    if (state.cooldowns[k] > 0) state.cooldowns[k] = Math.max(0, state.cooldowns[k] - dt);
  }
  updatePlants(dt);
  updateZombies(dt);
  if (state.over) return;
  updateProjectiles(dt);
  updateSuns(dt);
  updateBombs(dt);
  updateExplosions(dt);
  spawnLogic(dt);
  updateHUD();
}

function drawBackground(){
  ctx.fillStyle = '#2f4a22';
  ctx.fillRect(0,0,CV.width,CV.height);
  if (ok(IMG.background)){
    ctx.drawImage(IMG.background, 0, 0, CV.width, CV.height);
  }else{
    for (let r=0;r<ROWS;r++){
      for (let c=0;c<9;c++){
        ctx.fillStyle = (r % 2 === 0) ? '#5a9440' : '#4d8235';
        ctx.fillRect(LAWN_X + c*CELL_W, LAWN_Y + r*CELL_H, CELL_W, CELL_H);
      }
    }
    ctx.fillStyle = '#3a5a28';
    ctx.fillRect(0,0,LAWN_X,CV.height);
  }

  ctx.save();
  ctx.fillStyle = 'rgba(140,255,120,0.10)';
  ctx.fillRect(0, 0, PLANT_ZONE_RIGHT, CV.height);
  ctx.strokeStyle = 'rgba(140,255,120,0.70)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 10]);
  ctx.beginPath();
  ctx.moveTo(PLANT_ZONE_RIGHT, 0);
  ctx.lineTo(PLANT_ZONE_RIGHT, CV.height);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(160,255,140,0.85)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('种 植 区', PLANT_ZONE_RIGHT/2, 22);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = 'rgba(180,255,160,0.65)';
  ctx.fillText('（左侧 1/4；尊地雷 / 茅弹可全屏）', PLANT_ZONE_RIGHT/2, 40);
  ctx.restore();
}

function drawDialogBubble(x, y, text, scale, alpha){
  if (scale <= 0.001 || alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.translate(-x, -y);

  ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw = ctx.measureText(text).width;
  const pw = tw + 28, ph = 34;
  const px = x - pw/2, py = y - ph - 16;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  rr(px, py, pw, ph, 10);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(60,60,60,0.9)';
  ctx.lineWidth = 2;
  rr(px, py, pw, ph, 10);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.beginPath();
  ctx.moveTo(x - 8, py + ph - 1);
  ctx.lineTo(x + 8, py + ph - 1);
  ctx.lineTo(x, py + ph + 12);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,60,60,0.9)';
  ctx.beginPath();
  ctx.moveTo(x - 8, py + ph);
  ctx.lineTo(x, py + ph + 12);
  ctx.lineTo(x + 8, py + ph);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, py + ph/2 + 1);
  ctx.restore();
}

function drawPlant(p){
  const def = PLANTS[p.type];
  const w = 76, h = 92;
  if (def.kind !== 'tank'){
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 42, 27, 9, 0, 0, Math.PI*2);
    ctx.fill();
  }
  const breathe = def.kind === 'wall' ? 1 : 1 + Math.sin(p.t*3) * 0.018;
  const dw = w * breathe, dh = h * breathe;
  if (dragPlant === p){ ctx.save(); ctx.globalAlpha = 0.9; }
  drawAsset(IMG[def.img], p.x - dw/2, p.y - dh/2 + 8, dw, dh, def.fallback);
  if (dragPlant === p) ctx.restore();

  if (dragPlant === p){
    ctx.save();
    ctx.strokeStyle = isValidPos(p.x, p.y, p) ? '#8dff6b' : '#ff5a5a';
    ctx.lineWidth = 2;
    ctx.setLineDash([7,5]);
    ctx.strokeRect(p.x - 40, p.y - 48, 80, 96);
    ctx.restore();
  }
  if (p.hp < p.maxHp){
    const bw = 52, bh = 5;
    const bx = p.x - bw/2, by = p.y - h/2 - 4;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    const ratio = Math.max(0, p.hp / p.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#5ddc4a' : (ratio > 0.25 ? '#f5c542' : '#e8503a');
    ctx.fillRect(bx, by, bw*ratio, bh);
  }
}

function drawZombie(z){
  const def = ZOMBIES[z.type];
  const w = def.w, h = def.h;
  const bob = z.eating ? Math.sin(z.walkT*8)*2 : Math.sin(z.walkT)*3;
  const yOff = z.drawYOffset || 0;
  const x = z.x - w/2;
  const y = z.y - h/2 + bob + yOff;

  if (!z.jumping){
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.ellipse(z.x, z.y + h/2 - 6, 24, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }else{
    const alt = -yOff / 170;
    ctx.save();
    ctx.globalAlpha = 0.22 * (1 - alt);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(z.x, z.jumpEndY + h/2 - 6, 24*(1-alt*0.5), 8*(1-alt*0.5), 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  if (z.jumpFlash > 0){
    const p = 1 - z.jumpFlash / 0.5;
    ctx.save();
    ctx.globalAlpha = (1 - p) * 0.85;
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(z.x, z.y, 30 + p * 60, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  drawAsset(IMG[def.img], x, y, w, h, def.fallback);

  if (z.slowTimer > 0){
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#7fe4ff';
    rr(x, y, w, h, 12);
    ctx.fill();
    ctx.restore();
  }
  if (z.hitFlash > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(0.55, z.hitFlash*4);
    ctx.fillStyle = '#ffffff';
    rr(x, y, w, h, 12);
    ctx.fill();
    ctx.restore();
  }
  if (z.blocked){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 3;
    ctx.setLineDash([8,5]);
    rr(x-3, y-3, w+6, h+6, 14);
    ctx.stroke();
    ctx.restore();
  }
  if (z.hp < z.maxHp){
    const bw = 46, bh = 5;
    const bx = z.x - bw/2, by = y - 10;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    const ratio = Math.max(0, z.hp / z.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#e8503a' : (ratio > 0.25 ? '#f5a742' : '#8b1e1e');
    ctx.fillRect(bx, by, bw*ratio, bh);
  }
}

function drawProjectile(pr){
  if (pr.kind === 'pea'){
    drawAsset(IMG.pea, pr.x-13, pr.y-13, 26, 26, '#63c24a');
  }else if (pr.kind === 'ice'){
    drawAsset(IMG.ice, pr.x-13, pr.y-13, 26, 26, '#6fd3ea');
  }else if (pr.kind === 'cup'){
    ctx.save();
    ctx.translate(pr.x, pr.y);
    ctx.rotate(pr.rot);
    drawAsset(IMG.cup, -18, -18, 36, 36, '#4aa3df');
    ctx.restore();
  }else if (pr.kind === 'word'){
    ctx.save();
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#ffffff';
    ctx.strokeText(pr.text, pr.x, pr.y);
    ctx.fillStyle = '#a259d6';
    ctx.fillText(pr.text, pr.x, pr.y);
    ctx.restore();
  }
}

function drawSun(s){
  const pulse = 1 + Math.sin((s.born + s.x*0.02) * 5) * 0.06;
  const size = 48 * pulse;
  const fade = (s.born > s.life - 2.5) ? (0.4 + 0.6*Math.abs(Math.sin(s.born*6))) : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  drawAsset(IMG.sun, s.x - size/2, s.y - size/2, size, size, '#ffd93b');
  ctx.restore();
}

function drawBombs(){
  for (const b of state.bombs){
    if (b.exploded) continue;
    ctx.save();
    ctx.globalAlpha = 0.35;
    const g = ctx.createLinearGradient(b.x, b.curY - 120, b.x, b.curY);
    g.addColorStop(0, 'rgba(255,200,80,0)');
    g.addColorStop(1, 'rgba(255,120,60,0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 8, b.curY - 120, 16, 120);
    ctx.restore();
    drawAsset(IMG.plant_maodan, b.x - 38, b.curY - 38, 76, 76, '#ff6b6b');
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = '#ffd75e';
    ctx.lineWidth = 3;
    ctx.setLineDash([9,6]);
    ctx.beginPath();
    ctx.arc(b.x, b.y, 34, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(b.x - 46, b.y); ctx.lineTo(b.x - 22, b.y);
    ctx.moveTo(b.x + 22, b.y); ctx.lineTo(b.x + 46, b.y);
    ctx.moveTo(b.x, b.y - 46); ctx.lineTo(b.x, b.y - 22);
    ctx.moveTo(b.x, b.y + 22); ctx.lineTo(b.x, b.y + 46);
    ctx.stroke();
    ctx.restore();
  }
}

function drawExplosions(){
  for (const e of state.explosions){
    const p = e.t / e.maxT;
    const r = e.radius * (0.35 + p * 0.65);
    const a = 1 - p;
    if (e.big){
      const flash = Math.max(0, 1 - p * 3) * 0.7;
      if (flash > 0){
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,220,' + flash.toFixed(3) + ')';
        ctx.fillRect(0, 0, CV.width, CV.height);
        ctx.restore();
      }
    }
    ctx.save();
    ctx.globalAlpha = a * 0.75;
    const g = ctx.createRadialGradient(e.x, e.y, r*0.15, e.x, e.y, r);
    g.addColorStop(0,   'rgba(255,255,200,0.95)');
    g.addColorStop(0.4, 'rgba(255,170,60,0.75)');
    g.addColorStop(1,   'rgba(200,40,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = a;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,240,180,0.9)';
    ctx.beginPath();
    ctx.arc(e.x, e.y, r*0.92, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

/* ★ 暂停时覆盖层 */
function drawPausedOverlay(){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, CV.width, CV.height);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 52px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#c9f58e';
  ctx.fillText('已 暂 停', CV.width/2, CV.height/2 - 30);

  ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#d8e6cd';
  ctx.fillText('点击右上角 ▶ 按钮继续游戏', CV.width/2, CV.height/2 + 40);

  /* 顶部两竖条装饰 */
  ctx.fillStyle = 'rgba(201,245,142,0.85)';
  const cx = CV.width/2, cy = CV.height/2 - 110;
  ctx.fillRect(cx - 22, cy - 22, 14, 44);
  ctx.fillRect(cx + 8,  cy - 22, 14, 44);

  ctx.restore();
}

function render(){
  drawBackground();

  const drawList = [];
  state.plants.forEach(p => drawList.push({ y: p.y, fn: ()=>drawPlant(p) }));
  state.zombies.forEach(z => drawList.push({ y: z.y + (z.jumping ? -200 : 0), fn: ()=>drawZombie(z) }));
  drawList.sort((a,b)=>a.y-b.y);
  drawList.forEach(d => d.fn());

  state.projectiles.forEach(drawProjectile);
  state.suns.forEach(drawSun);
  drawBombs();
  drawExplosions();

  for (const z of state.zombies){
    if (!z.blocked || z.jumping) continue;
    const def = ZOMBIES[z.type];
    const bob = z.eating ? Math.sin(z.walkT*8)*2 : Math.sin(z.walkT)*3;
    const anchorY = z.y - def.h/2 + bob - 2;
    const t = Math.min(1, (z.dialogAge || 0) / 0.28);
    const scale = easeOutBack(t);
    drawDialogBubble(z.x, anchorY, '♫但有...♫', scale, 1);
  }

  const previewKey = (!state.paused && cardDrag) ? cardDrag.key
                   : (!state.paused ? state.selected : null);
  if (state.running && !state.over && !state.paused && previewKey && mouseX > -100){
    const def = PLANTS[previewKey];
    const valid = isValidPos(mouseX, mouseY, {type: previewKey});
    if (previewKey === 'maodan'){
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = valid ? 'rgba(255,215,94,0.95)' : 'rgba(255,90,90,0.9)';
      ctx.lineWidth = 3;
      ctx.setLineDash([9,6]);
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 42, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(mouseX-54, mouseY); ctx.lineTo(mouseX-26, mouseY);
      ctx.moveTo(mouseX+26, mouseY); ctx.lineTo(mouseX+54, mouseY);
      ctx.moveTo(mouseX, mouseY-54); ctx.lineTo(mouseX, mouseY-26);
      ctx.moveTo(mouseX, mouseY+26); ctx.lineTo(mouseX, mouseY+54);
      ctx.stroke();
      ctx.restore();
    }else{
      ctx.save();
      ctx.globalAlpha = 0.55;
      drawAsset(IMG[def.img], mouseX-38, mouseY-46+8, 76, 92, def.fallback);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = valid ? 'rgba(140,255,110,0.9)' : 'rgba(255,90,90,0.9)';
      ctx.lineWidth = 2;
      ctx.setLineDash([7,5]);
      ctx.strokeRect(mouseX-40, mouseY-48, 80, 96);
      ctx.restore();
    }
  }

  /* ★ 暂停覆盖层画在最上层 */
  if (state.running && !state.over && state.paused){
    drawPausedOverlay();
  }
}

/* =========================================================
   13. 循环
   ========================================================= */
let lastTs = 0;
function loop(ts){
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (state.running && !state.over && !state.paused) update(dt);
  else updateHUD();

  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   14. 交互
   ========================================================= */
function toCanvas(e){
  const r = CV.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(CV.width/r.width), y:(e.clientY-r.top)*(CV.height/r.height) };
}

function tryPlacePlant(x, y, key){
  const def = PLANTS[key];
  if (state.cooldowns[key] > 0) return false;
  if (state.sun < def.cost) return false;
  if (!isValidPos(x, y, {type: key})) return false;

  state.plants.push({
    type: key, x, y,
    hp: def.hp, maxHp: def.hp,
    cd: def.kind === 'sun' ? 5 : (def.kind === 'mine' ? 0 : 0.5),
    t: Math.random()*6
  });
  state.sun -= def.cost;
  state.cooldowns[key] = def.cooldown;
  state.selected = null;
  updateHUD();
  return true;
}

function fireMaodan(x, y){
  const def = PLANTS.maodan;
  if (state.cooldowns.maodan > 0) return false;
  if (state.sun < def.cost) return false;
  if (x < 0 || x > CV.width || y < 0 || y > CV.height) return false;
  state.bombs.push({ x, y, curY: -100, vy: 0, exploded: false });
  state.sun -= def.cost;
  state.cooldowns.maodan = def.cooldown;
  state.selected = null;
  updateHUD();
  return true;
}

CV.addEventListener('pointerdown', e=>{
  if (!state.running || state.over || state.paused) return;   /* ★ 暂停时禁止交互 */
  if (cardDrag) return;
  e.preventDefault();
  const p = toCanvas(e);
  mouseX = p.x; mouseY = p.y;

  for (let i=state.suns.length-1;i>=0;i--){
    const s = state.suns[i];
    if (Math.hypot(s.x-p.x, s.y-p.y) < 46){
      state.sun += s.value;
      state.suns.splice(i,1);
      updateHUD();
      return;
    }
  }

  if (shovelMode){
    const idx = findPlantIndexAt(p.x, p.y);
    if (idx >= 0){
      state.plants.splice(idx,1);
      shovelMode = false;
      document.getElementById('shovelBtn').classList.remove('active');
    }
    return;
  }

  const idx = findPlantIndexAt(p.x, p.y);
  if (idx >= 0){
    dragPlant = state.plants[idx];
    dragOrigX = dragPlant.x;
    dragOrigY = dragPlant.y;
    dragOffX = dragPlant.x - p.x;
    dragOffY = dragPlant.y - p.y;
    state.plants.splice(idx,1);
    state.plants.push(dragPlant);
    return;
  }

  if (state.selected === 'maodan'){
    fireMaodan(p.x, p.y);
  }else if (state.selected){
    tryPlacePlant(p.x, p.y, state.selected);
  }
});

CV.addEventListener('pointermove', e=>{
  if (cardDrag) return;
  const p = toCanvas(e);
  mouseX = p.x; mouseY = p.y;
  if (dragPlant && !state.paused){
    let nx = p.x + dragOffX;
    let ny = p.y + dragOffY;
    nx = Math.max(0, Math.min(CV.width - 10, nx));
    ny = Math.max(LAWN_Y + 6, Math.min(CV.height - 10, ny));
    dragPlant.x = nx;
    dragPlant.y = ny;
  }
});

function endDrag(e){
  if (dragPlant){
    const p = toCanvas(e);
    const nx = p.x + dragOffX;
    const ny = p.y + dragOffY;
    if (isValidPos(nx, ny, dragPlant)){
      dragPlant.x = nx; dragPlant.y = ny;
    }else{
      dragPlant.x = dragOrigX; dragPlant.y = dragOrigY;
    }
    dragPlant = null;
  }
}

CV.addEventListener('pointerup', e=>{
  if (cardDrag) return;
  e.preventDefault();
  endDrag(e);
});

CV.addEventListener('pointercancel', e=>{
  if (cardDrag) return;
  if (dragPlant){
    dragPlant.x = dragOrigX;
    dragPlant.y = dragOrigY;
    dragPlant = null;
  }
});

CV.addEventListener('pointerleave', ()=>{
  if (cardDrag) return;
  if (dragPlant){
    dragPlant.x = dragOrigX;
    dragPlant.y = dragOrigY;
    dragPlant = null;
  }
  mouseX = -999; mouseY = -999;
});

document.getElementById('shovelBtn').addEventListener('click', function(){
  if (!state.running || state.paused) return;
  shovelMode = !shovelMode;
  state.selected = null;
  this.classList.toggle('active', shovelMode);
  updateHUD();
});

/* =========================================================
   ★ 卡片栏左右箭头滚动
   ========================================================= */
(function setupCardScroll(){
  const cardsBox = document.getElementById('cards');
  const btnL = document.getElementById('arrowLeft');
  const btnR = document.getElementById('arrowRight');
  const STEP = 120;

  function refreshArrows(){
    const maxScroll = cardsBox.scrollWidth - cardsBox.clientWidth;
    btnL.disabled = cardsBox.scrollLeft <= 1;
    btnR.disabled = cardsBox.scrollLeft >= maxScroll - 1;
  }

  btnL.addEventListener('click', ()=>{
    cardsBox.scrollBy({ left: -STEP, behavior: 'smooth' });
  });
  btnR.addEventListener('click', ()=>{
    cardsBox.scrollBy({ left:  STEP, behavior: 'smooth' });
  });
  cardsBox.addEventListener('scroll', refreshArrows);
  window.addEventListener('resize', refreshArrows);

  /* 卡片构建完之后再刷新一次状态 */
  const origBuild = buildCards;
  buildCards = function(){
    origBuild.apply(this, arguments);
    setTimeout(refreshArrows, 0);
  };
})();

/* =========================================================
   ★ 暂停键
   ========================================================= */
const pauseBtn = document.getElementById('pauseBtn');
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">' +
  '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>' +
  '<rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';
const ICON_PLAY  = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">' +
  '<path d="M7 5 L19 12 L7 19 Z" fill="currentColor"/></svg>';

function updatePauseButton(){
  if (state.paused){
    pauseBtn.innerHTML = ICON_PLAY;
    pauseBtn.classList.add('active');
    pauseBtn.title = '继续游戏';
  }else{
    pauseBtn.innerHTML = ICON_PAUSE;
    pauseBtn.classList.remove('active');
    pauseBtn.title = '暂停游戏';
  }
}

pauseBtn.addEventListener('click', ()=>{
  if (!state.running || state.over) return;
  state.paused = !state.paused;

  /* 暂停时清理所有拖拽状态，避免继续后错位 */
  if (state.paused){
    if (dragPlant){
      dragPlant.x = dragOrigX;
      dragPlant.y = dragOrigY;
      dragPlant = null;
    }
    if (cardDrag){
      const el = cardEls[cardDrag.key];
      if (el) el.classList.remove('dragging');
      cardDrag = null;
    }
  }
  updatePauseButton();
  updateHUD();
});

document.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){
    if (state.paused){
      state.paused = false;
      updatePauseButton();
    }
    state.selected = null;
    shovelMode = false;
    document.getElementById('shovelBtn').classList.remove('active');
    if (dragPlant){ dragPlant.x = dragOrigX; dragPlant.y = dragOrigY; dragPlant = null; }
    if (cardDrag){
      const el = cardEls[cardDrag.key];
      if (el) el.classList.remove('dragging');
      cardDrag = null;
    }
    updateHUD();
  }
  /* 空格也能暂停 */
  if (e.key === ' ' && state.running && !state.over){
    e.preventDefault();
    pauseBtn.click();
  }
});

/* =========================================================
   15. 启动
   ========================================================= */
Promise.all(
  Object.keys(ASSETS).map(k => loadImage(ASSETS[k]).then(im => { IMG[k] = im; }))
).then(()=>{
  buildCards();
  updatePauseButton();
  const best = loadBest();
  showOverlay(
    'MVC 3.0发布！',
    '植物大战僵尸自制版）第三版发布！\n' +
    '更新1：除尊地雷和茅弹外，所有植物只能种在左侧 1/4 种植区。\n' +
    '更新2：新增「茅弹」——550 阳光 / 冷却 3 分钟，\n' +
    '　　　　点击任意处从天而降，全屏清理僵尸。\n' +
    '更新3：坦克僵尸随机刷新，撞上坦克茅时双方停下。\n' +
    '更新4：按住卡片拖动可直接种植；点卡片 → 点草坪也可以。\n' +
    '更新5：300 秒后僵尸密度 ×4，注意防线！\n' +
    '新增：右上角暂停键，卡片栏左右箭头可滚动武器库。\n' +
    '挡住「春」，别让它们走到最左边！',
    best > 0 ? '历史最长存活：' + best.toFixed(1) + ' 秒' : '历史最长存活：——',
    '开始防守',
    startGame
  );
  updateHUD();
  requestAnimationFrame(loop);
});

})();
